id: apartment_2020_lightstone
label: 2020s light-stone apartment
era: 2020s
type: tower_apartment
tags: [apartment, tower, light-stone, dark-glass, white-frame, louver]
notes: >
  Derived from the Namsan 101 facade study. Neutral geometry/palette only;
  no brand, logo, or sign text. Reuse as the default 2020s apartment finish.

palette:
  wall: [210, 214, 216]
  wall_light: [219, 222, 223]
  stone: [86, 89, 93]
  band: [226, 228, 228]
  trim: [228, 230, 230]
  pier: [74, 78, 83]
  accent: [31, 42, 55]
  door: [35, 37, 40]
  frame: [46, 49, 54]
  louver: [46, 50, 54]
  vent: [145, 150, 156]
  spandrel: [153, 166, 174]
  screen: [36, 40, 44]
  roof: [150, 150, 146]
  solar: [30, 44, 64]
  led: [255, 246, 226]

window:
  # fallback window (single punched bay)
  width_m: 1.55
  height_m: 1.48
  sill_m: 0.88
  panes: 2
  glass: [54, 72, 88]
  frame: [198, 198, 193]
  frame_width_m: 0.120
  frame_depth_m: 0.034
  # per-bay families observed on the 101 facade
  wide_width_m: 2.55
  wide_height_m: 1.62
  wide_sill_m: 0.78
  medium_width_m: 2.05
  medium_height_m: 1.62
  medium_sill_m: 0.78
  small_width_m: 0.95
  small_height_m: 1.48
  small_sill_m: 0.88
  narrow_width_m: 0.55
  narrow_height_m: 1.90
  narrow_sill_m: 0.55
  std_width_m: 1.35
  std_height_m: 1.48
  std_sill_m: 0.88
  front_width_m: 1.55
  front_height_m: 1.58
  front_sill_m: 0.82
  night_color: [255, 255, 255]
  night_lit_ratio: 0.32
  night_patch_grid: 24

layers:
  band_height_m: 0.18
  band_shadow_m: 0.08
  spandrel_height_m: 0.42
  louver_width_m: 0.44
  louver_every: 2
  pier_width_m: 0.12
  corner_post_m: 0.14
  wall_tile_m: [3.0, 2.83]
  stone_tile_m: [3.0, 2.83]
  window_tile_m: [3.0, 2.83]

night:
  color: [255, 255, 255]
  lit_ratio: 0.32
  patch_grid: 24
  note: hashed per-window-cell patches, not per-building floodlight

zones:
  front: dense windows + widened dark core
  front_left_narrow: 3 narrow columns + blue-grey strip
  back: dense windows
  left: windowed long side
  right: dark sign end wall
  steps: punched windows + louver slots
